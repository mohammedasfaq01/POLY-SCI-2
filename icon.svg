<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect with safe margin padding -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer subtle glowing ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="12 8" opacity="0.6"/>

  <!-- Orbital STEM ellipse 1 -->
  <ellipse cx="256" cy="256" rx="150" ry="65" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" transform="rotate(-30 256 256)" opacity="0.85"/>
  <circle cx="380" cy="180" r="12" fill="#34d399" />

  <!-- Orbital STEM ellipse 2 -->
  <ellipse cx="256" cy="256" rx="150" ry="65" fill="none" stroke="url(#amberGrad)" stroke-width="8" transform="rotate(30 256 256)" opacity="0.85"/>
  <circle cx="130" cy="190" r="10" fill="#fbbf24" />

  <!-- Central Shield / Quest Crystal -->
  <path d="M 256 140 L 330 195 L 305 310 L 256 365 L 207 310 L 182 195 Z" fill="url(#emeraldGrad)" />

  <!-- Inner Sparkle / Star of Knowledge -->
  <polygon points="256,190 268,230 308,242 268,254 256,294 244,254 204,242 244,230" fill="#ffffff" />

  <!-- Duo-style Level Up Cap / Torch detail -->
  <path d="M 230 380 Q 256 370 282 380 L 290 410 Q 256 425 222 410 Z" fill="#fbbf24" />
</svg>
